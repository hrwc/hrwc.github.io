<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Nixware</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background-color: #121212; /* фон сайта */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .captcha-box {
      background: #1e1e1e; /* фон капчи */
      padding: 20px 40px;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      z-index: 1;
    }

    .checkbox-area {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: #f1f1f1;
    }

    .checkbox-area input {
      width: 20px;
      height: 20px;
      accent-color: #00bfff;
    }

    #screamer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: black;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #screamer img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="captcha-box">
  <div class="checkbox-area" onclick="triggerScreamer()">
    <input type="checkbox" id="robot-checkbox">
    <label for="robot-checkbox">Я не робот</label>
  </div>
</div>

<div id="screamer">
  <img src="screamer.gif" alt="Screamer">
</div>

<audio id="scream-sound" src="gudok-poezda.mp3"></audio>

<script>
  function triggerScreamer() {
    const screamer = document.getElementById('screamer');
    const audio = document.getElementById('scream-sound');

    screamer.style.display = 'flex';
    audio.play();

    if (document.body.requestFullscreen) {
      document.body.requestFullscreen();
    }

    document.onkeydown = () => false;
    window.onbeforeunload = () => true;
  }
</script>

</body>
</html>
