## 一、超递归模板元编程

### 1.1 让编译器帮你AC

```cpp
template<int ProblemID>
struct AutoAC {
    constexpr auto solve() {
        if constexpr (ProblemID == 1) return "AK IOI";
        else return AutoAC<ProblemID-1>::solve();
    }
};

// 使用示例：让编译器递归求解1000道题
static_assert(AutoAC<1000>::solve() == "AK IOI");
```

这段代码的精妙之处在于：`当编译器崩溃时，意味着它正在努力工作。`根据量子Zeno效应，观察编译过程会导致编译时间无限延长，在此期间你可以去参加下一场竞赛。
